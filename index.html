<script>
  const player = document.getElementById("soundcloud-player");
  const buttons = document.querySelectorAll("#playlist-buttons button");

  const baseURL = "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A";
  const params = "&color=%2364eb84&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true";

  function loadPlaylist(id) {
    player.src = `${baseURL}${id}${params}`;
  }

  // Standardmäßig erste Playlist laden
  loadPlaylist(buttons[0].dataset.id);

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      loadPlaylist(button.dataset.id);
    });
  });
</script>
